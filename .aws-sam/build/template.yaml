AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Auto Vision Checkout capture stack (issue #14): one S3 bucket, the capture
  API (FastAPI on Lambda behind an HTTP API via Lambda Web Adapter), and the #12 annotator
  (Lambda container triggered by raw/ uploads). Recognition (#21) and retrain (#16)
  add to this stack later.

  '
Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name for captures, datasets, and models.
      Set in samconfig.toml.
    AllowedPattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
  CorsOrigins:
    Type: String
    Default: http://localhost:5173,http://127.0.0.1:5173
    Description: Comma-separated console origins allowed by the API (AVC_CORS_ORIGINS)
      and the bucket POST CORS.
Resources:
  CaptureBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: AnnotatorInvokePermission
    Properties:
      BucketName:
        Ref: BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
        - AllowedMethods:
          - POST
          AllowedOrigins:
            Fn::Split:
            - ','
            - Ref: CorsOrigins
          AllowedHeaders:
          - '*'
          MaxAge: 3000
      NotificationConfiguration:
        LambdaConfigurations:
        - Event: s3:ObjectCreated:*
          Function:
            Fn::GetAtt:
            - AnnotatorFunction
            - Arn
          Filter:
            S3Key:
              Rules:
              - Name: prefix
                Value: raw/
  AnnotatorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: /home/dragos/projects/Auto-Checkout
      Dockerfile: infra/annotator.Dockerfile
      SamResourceId: AnnotatorFunction
    Properties:
      PackageType: Image
      Architectures:
      - x86_64
      MemorySize: 3008
      Timeout: 900
      Environment:
        Variables:
          ANNOTATOR_IMAGE:
            Fn::Sub: ${AWS::StackName}-annotator
      Policies:
      - AWSLambdaBasicExecutionRole
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - s3:GetObject
          Resource:
          - Fn::Sub: arn:aws:s3:::${BucketName}/raw/*
          - Fn::Sub: arn:aws:s3:::${BucketName}/captures/*
        - Effect: Allow
          Action:
          - s3:ListBucket
          Resource:
            Fn::Sub: arn:aws:s3:::${BucketName}
          Condition:
            StringLike:
              s3:prefix:
              - raw/*
              - captures/*
        - Effect: Allow
          Action:
          - s3:PutObject
          Resource:
            Fn::Sub: arn:aws:s3:::${BucketName}/captures/*
      ImageUri: annotatorfunction:latest
  AnnotatorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: AnnotatorFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount:
        Ref: AWS::AccountId
      SourceArn:
        Fn::Sub: arn:aws:s3:::${BucketName}
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
  CaptureApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: /home/dragos/projects/Auto-Checkout
      Dockerfile: infra/api.Dockerfile
      SamResourceId: CaptureApiFunction
    Properties:
      PackageType: Image
      Architectures:
      - x86_64
      MemorySize: 1024
      Timeout: 30
      Environment:
        Variables:
          AVC_STORE:
            Fn::Sub: s3://${BucketName}
          AVC_CORS_ORIGINS:
            Ref: CorsOrigins
      Policies:
      - AWSLambdaBasicExecutionRole
      - Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - s3:GetObject
          Resource:
            Fn::Sub: arn:aws:s3:::${BucketName}/*
        - Effect: Allow
          Action:
          - s3:ListBucket
          Resource:
            Fn::Sub: arn:aws:s3:::${BucketName}
        - Effect: Allow
          Action:
          - s3:PutObject
          Resource:
          - Fn::Sub: arn:aws:s3:::${BucketName}/captures/*
          - Fn::Sub: arn:aws:s3:::${BucketName}/raw/*
          - Fn::Sub: arn:aws:s3:::${BucketName}/catalog.json
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: HttpApi
            Path: /
            Method: ANY
      ImageUri: captureapifunction:latest
Outputs:
  ApiUrl:
    Description: "Capture API base URL \u2014 set frontend VITE_CAPTURE_API_URL to\
      \ this."
    Value:
      Fn::Sub: https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  BucketName:
    Description: Capture bucket (retained on sam delete).
    Value:
      Ref: CaptureBucket
