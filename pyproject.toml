[project]
name = "auto-checkout"
version = "0.1.0"
description = "Barcode-free self-checkout kiosk for grocery stores, powered by computer vision."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pillow>=11,<14",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
ml = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pandas>=3.1.1",
    "pillow-heif>=1.8.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.211",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# CUDA wheels on Windows/Linux; macOS falls back to PyPI (MPS/CPU)
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
