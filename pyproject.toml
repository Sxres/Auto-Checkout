[project]
name = "auto-checkout"
version = "0.1.0"
description = "Barcode-free self-checkout kiosk for grocery stores, powered by computer vision."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false
